<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EVS Replay Regie</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #171b21;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        .main-panel {
            flex: 3;
        }

        .side-panel {
            flex: 1;
            background: #222831;
            padding: 15px;
            border-radius: 8px;
            height: 90vh;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-red {
            background-color: #c95858;
            color: white;
        }

        .btn-blue {
            background-color: #527fa9;
            color: white;
        }

        .btn-green {
            background-color: #54896d;
            color: white;
            margin-right: 5px;
        }

        .btn-gold {
            background-color: #c4a568;
            color: black;
        }

        .video-container {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        video {
            max-width: 100%;
            max-height: 500px;
            border-radius: 4px;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            background: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .time-box {
            background: #191f27;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            text-align: center;
            margin-top: 5px;
        }

        #status-log {
            background: #111;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: #a7b6a9;
            height: 100px;
            overflow-y: auto;
        }

        .clip-item {
            background: #2b333e;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            word-break: break-all;
        }

        .clip-item:hover,
        .clip-item.active {
            background: #527fa9;
        }
        * { box-sizing: border-box; }
        body { line-height: 1.5; padding: 24px; gap: 24px; }
        .main-panel { min-width: 0; }
        .side-panel { min-width: 250px; height: calc(100vh - 48px); border: 1px solid #323b47; padding: 18px; }
        .header { align-items: center; gap: 16px; border-bottom: 1px solid #323b47; padding-bottom: 18px; }
        h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.4px; }
        h3 { font-size: 15px; font-weight: 600; }
        .btn { font: inherit; font-size: 13px; font-weight: 600; border-radius: 7px; transition: filter 150ms ease, background-color 150ms ease; }
        .btn:hover { filter: brightness(1.12); }
        .btn:active { filter: brightness(.92); }
        .btn:focus-visible, .clip-item:focus-visible { outline: 2px solid #93b9df; outline-offset: 3px; }
        .video-container { padding: 16px; border: 1px solid #303843; }
        .controls { gap: 16px; flex-wrap: wrap; align-items: center; border: 1px solid #323b47; }
        .time-box { color: #b9c4d2; font-size: 13px; }
        #status-log { background: #13171c; border: 1px solid #303843; font-size: 12px; line-height: 1.7; }
        .clip-item { padding: 12px; margin-bottom: 8px; border-radius: 6px; overflow-wrap: anywhere; word-break: normal; transition: background-color 150ms ease; }
        .clip-item:hover { background: #354353; }
        .clip-item.active { background: #365573; }
        @media (max-width: 900px) {
            body { flex-direction: column; padding: 16px; gap: 16px; }
            .side-panel { height: auto; max-height: 400px; min-width: 0; }
            .header { flex-wrap: wrap; }
        }
        @media (prefers-reduced-motion: reduce) { .btn, .clip-item { transition: none; } }
    </style>
</head>

<body>

    <div class="main-panel">
        <div class="header">
            <h1>Replay Regie</h1><button class="btn btn-blue" onclick="openSettings()">Einstellungen</button>
            <button class="btn btn-red" onclick="triggerReplay()">NEUEN CLIP SPEICHERN</button>
        </div>

        <div class="video-container">
            <h3 id="current-file" style="margin-top: 0; color: #aaa;">Kein Clip geladen</h3>
            <video id="player" controls></video>
        </div>

        <div class="controls">
            <div>
                <button class="btn btn-blue" onclick="setIn()">[ IN-POINT</button>
                <div class="time-box" id="in-display">IN: 0.00s</div>
            </div>
            <div style="text-align: center;">
                <button class="btn btn-green" onclick="cutVideo('round')">IN RUNDE</button>
                <button class="btn btn-gold" onclick="cutVideo('match')">IN MATCH</button>
            </div>
            <div>
                <button class="btn btn-blue" onclick="setOut()">OUT-POINT ]</button>
                <div class="time-box" id="out-display">OUT: Ende</div>
            </div>
            <div style="text-align: center; margin-bottom: 10px;">
                <button class="btn btn-gold" onmousedown="startRW()" onmouseup="stopSeek()"
                    onmouseleave="stopSeek()">&laquo; REWIND</button>
                <button class="btn btn-gold" onmousedown="startFF()" onmouseup="stopSeek()"
                    onmouseleave="stopSeek()">FAST FWD &raquo;</button>
            </div>
        </div>

        <div id="status-log">System bereit...<br></div>
    </div>

    <div class="side-panel">
        <h3>Gesammelte Clips</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">Gesammelte Clips</h3>
            <button class="btn btn-red" style="padding: 5px 10px; font-size: 11px;" onclick="triggerReset()">RUNDE
                RESET</button>
        </div>
        <div id="clip-list">Lade Clips...</div>
    </div>

    <dialog id="settings" aria-labelledby="settings-title" style="background:#222831;color:white;border-radius:8px;max-width:90vw">
      <form id="settings-form">
        <h2 id="settings-title">OBS-Verbindung</h2>
        <p><label>WebSocket-Adresse<br><input id="obs-url" type="url" required style="width:100%"></label></p>
        <p><label>Passwort<br><input id="obs-password" type="password" autocomplete="new-password"></label></p>
        <p>Leer lassen, um das Passwort beizubehalten.</p>
        <p><label><input id="obs-clear" type="checkbox"> Passwort entfernen</label></p>
        <p>Wird gespeichert und bleibt nach einem Serverneustart erhalten.</p>
        <p id="settings-status" role="status"></p>
        <button id="settings-save" class="btn btn-green">Übernehmen &amp; verbinden</button>
        <button type="button" class="btn btn-blue" onclick="document.getElementById('settings').close()">Schließen</button>
      </form>
    </dialog>
    <script>
        async function openSettings() {
            document.getElementById('settings').showModal();
            const button = document.getElementById('settings-save');
            button.disabled = true;
            try {
                const response = await fetch('/api/obs-settings');
                if (!response.ok) throw new Error('Bitte zuerst anmelden.');
                const settings = await response.json();
                document.getElementById('obs-url').value = settings.url;
                document.getElementById('obs-password').value = '';
                document.getElementById('obs-clear').checked = false;
                document.getElementById('settings-status').textContent = '';
                button.disabled = false;
            } catch (error) { document.getElementById('settings-status').textContent = error.message; }
        }
        document.getElementById('settings-form').addEventListener('submit', async event => {
            event.preventDefault();
            const button = document.getElementById('settings-save');
            const status = document.getElementById('settings-status');
            const settings = { url: document.getElementById('obs-url').value.trim() };
            const password = document.getElementById('obs-password').value;
            if (document.getElementById('obs-clear').checked) settings.password = '';
            else if (password) settings.password = password;
            button.disabled = true;
            status.textContent = 'Verbinde...';
            try {
                const response = await fetch('/api/obs-settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error);
                document.getElementById('obs-password').value = '';
                status.textContent = result.connected ? 'OBS verbunden.' : 'Gespeichert. Verbindung wird erneut versucht.';
            } catch (error) { status.textContent = error.message; }
            finally { button.disabled = false; }
        });

        const socket = io({ autoConnect: false });
        const player = document.getElementById('player');
        const statusLog = document.getElementById('status-log');
        const clipList = document.getElementById('clip-list');

        let currentFileName = null;
        let inTime = 0;
        let outTime = 0;
        let seekInterval;
        let seekMultiplier = 1;
        let isSeeking = false;
        let wasPlaying = false;

        function logMessage(msg, color = null) {
            const line = document.createElement('div');
            line.textContent = msg;
            if (color) line.style.color = color;
            statusLog.appendChild(line);
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        async function authenticate() {
            const savedToken = sessionStorage.getItem('replayControlToken');
            const token = savedToken || prompt('Zugriffstoken für die Replay-Regie:');
            if (!token) throw new Error('Kein Zugriffstoken eingegeben.');

            const response = await fetch('/api/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            if (!response.ok) {
                sessionStorage.removeItem('replayControlToken');
                throw new Error('Authentifizierung fehlgeschlagen.');
            }
            sessionStorage.setItem('replayControlToken', token);
            socket.connect();
            await loadClipList();
        }

        // Lädt alle Clips vom Server in die rechte Leiste
        async function loadClipList() {
            const res = await fetch('/api/files');
            const files = await res.json();
            clipList.innerHTML = '';
            files.forEach(file => addClipToList(file, false)); // Neueste oben
        }
        authenticate().catch((error) => logMessage(error.message));

        function addClipToList(fileName, prepend = true) {
            if (Array.from(clipList.children).some(clip => clip.dataset.fileName === fileName)) return false;
            const div = document.createElement('div');
            div.dataset.fileName = fileName;
            div.className = 'clip-item';
            div.innerText = fileName;
            div.onclick = () => loadVideo(fileName, div);
            if (prepend) clipList.prepend(div);
            else clipList.append(div);
            return true;
        }

        function loadVideo(fileName, element = null) {
            currentFileName = fileName;
            document.getElementById('current-file').innerText = "Schneide: " + fileName;

            // Aktiven Clip in der Liste farblich markieren
            document.querySelectorAll('.clip-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            player.pause();
            player.removeAttribute('src');
            player.load();
            player.src = "/raw_videos/" + encodeURIComponent(fileName);
            player.load();

            inTime = 0; outTime = 0;
            document.getElementById('in-display').innerText = "IN: 0.00s";
            document.getElementById('out-display').innerText = "OUT: Ende";
        }

        socket.on('replay_error', (message) => logMessage(`OBS: ${message}`));
        function triggerReplay() {
            socket.emit('trigger_replay', (result) => {
                if (!result?.ok) logMessage(`OBS: ${result?.error || 'Unbekannter Fehler'}`);
            });
        }
        socket.on('obs_status', (status) => {
            logMessage(status.connected ? 'OBS verbunden' : `OBS getrennt${status.error ? `: ${status.error}` : ''}`);
        });
        socket.on('new_replay_available', (fileName) => {
            logMessage("Neuer Clip: " + fileName);
            if (!addClipToList(fileName)) return;
            loadVideo(fileName, clipList.firstChild); // Direkt laden
        });

        function setIn() { inTime = player.currentTime; document.getElementById('in-display').innerText = `IN: ${inTime.toFixed(2)}s`; }
        function setOut() { outTime = player.currentTime; document.getElementById('out-display').innerText = `OUT: ${outTime.toFixed(2)}s`; }

        function cutVideo(target) {
            if (!currentFileName) return alert("Kein Video geladen!");
            if (outTime === 0) outTime = player.duration;
            if (inTime >= outTime) return alert("IN liegt nach OUT!");

            logMessage(`Exportiere nach ${target.toUpperCase()}...`);
            socket.emit('cut_video', { fileName: currentFileName, inTime, outTime, target });
        }

        socket.on('cut_success', (data) => logMessage(`Clip in ${data.target.toUpperCase()} gespeichert!`));
        socket.on('cut_error', (err) => logMessage(`FEHLER: ${err}`));
        // --- FERNSTEUERUNG VOM STREAM DECK EMPFANGEN ---
        socket.on('remote_command', (cmd) => {
            // Das zeigt dir im Browser an, dass der Befehl wirklich durchkam
            logMessage(`Stream Deck Befehl: ${cmd}`, '#f39c12');

            if (cmd === 'set-in') setIn();
            else if (cmd === 'set-out') setOut();
            else if (cmd === 'cut-round') cutVideo('round');
            else if (cmd === 'cut-match') cutVideo('match');
            else if (cmd === 'play-pause') {
                if (player.paused) player.play();
                else player.pause();
            }
            else if (cmd === 'next-clip') selectNextClip();
            else if (cmd === 'prev-clip') selectPrevClip();
            else if (cmd === 'ff-start') startFF();
            else if (cmd === 'rw-start') startRW();
            else if (cmd === 'seek-stop') stopSeek();
        });

        // --- NAVIGATION ---
        function selectNextClip() {
            const items = Array.from(document.querySelectorAll('.clip-item'));
            if (items.length === 0) return;
            const currentIndex = items.findIndex(el => el.classList.contains('active'));
            const nextIndex = currentIndex < items.length - 1 ? currentIndex + 1 : 0;
            items[nextIndex].click();
        }

        function selectPrevClip() {
            const items = Array.from(document.querySelectorAll('.clip-item'));
            if (items.length === 0) return;
            const currentIndex = items.findIndex(el => el.classList.contains('active'));
            const prevIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
            items[prevIndex].click();
        }

        // --- DYNAMISCHES SPULEN ---
        function startFF() {
            if (isSeeking) return;
            isSeeking = true;
            wasPlaying = !player.paused;
            seekMultiplier = 2.0; // Startet bei 2-facher Geschwindigkeit

            player.play();
            player.playbackRate = seekMultiplier;

            seekInterval = setInterval(() => {
                if (seekMultiplier < 8.0) { // Limit auf 8-fache Geschwindigkeit
                    seekMultiplier += 0.5;
                    player.playbackRate = seekMultiplier;
                }
            }, 250); // Erhöht sich alle 250 Millisekunden
        }

        function startRW() {
            if (isSeeking) return;
            isSeeking = true;
            wasPlaying = !player.paused;

            player.pause(); // Video anhalten, um manuell rückwärts zu springen
            seekMultiplier = 1.0;

            seekInterval = setInterval(() => {
                player.currentTime = Math.max(0, player.currentTime - (0.05 * seekMultiplier));
                if (seekMultiplier < 20.0) { // Beschleunigungs-Limit rückwärts
                    seekMultiplier += 1.0;
                }
            }, 50); // Rattert 20-mal pro Sekunde rückwärts
        }

        function stopSeek() {
            if (!isSeeking) return;
            isSeeking = false;
            clearInterval(seekInterval);
            player.playbackRate = 1.0; // Normales Tempo wiederherstellen

            if (wasPlaying) player.play();
            else player.pause();
        }

        // Empfängt das Reset-Signal vom Server
        socket.on('reset_dashboard', () => {
            logMessage('Runden-Reset ausgeführt: Ordner geleert & Backup erstellt.');

            // Sidebar leeren
            clipList.innerHTML = '<div style="color: #77f; padding: 5px;">Keine Clips (Ordner leer)</div>';

            // Aktiven Player stoppen und zurücksetzen
            player.pause();
            player.removeAttribute('src');
            player.load();
            document.getElementById('current-file').innerText = "Kein Clip geladen";
            currentFileName = null;
            inTime = 0;
            outTime = 0;
            document.getElementById('in-display').innerText = "IN: 0.00s";
            document.getElementById('out-display').innerText = "OUT: Ende";
        });

        async function triggerReset() {
            if (confirm("Möchtest du die Runde wirklich beenden? Alle Clips werden archiviert und die Liste geleert!")) {
                const response = await fetch('/api/reset-round', { method: 'POST' });
                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    logMessage(`Reset fehlgeschlagen: ${result.error || response.statusText}`);
                }
            }
        }
    </script>

</body>

</html>
